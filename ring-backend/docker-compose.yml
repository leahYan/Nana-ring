services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ring-backend
    env_file:
      - .env
    ports:
      - "8000:8000"     # direct access for local testing / curl
    restart: unless-stopped
    networks:
      - ring-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s   # give FastAPI time to connect to Supabase on cold start

  nginx:
    image: nginx:alpine
    container_name: ring-nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      # 443 is commented out until SSL certs are in place on the VPS
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - ring-network

networks:
  ring-network:
    driver: bridge
