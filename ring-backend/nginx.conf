worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream points to the FastAPI container by its docker-compose service name
    upstream fastapi {
        server backend:8000;
    }

    server {
        listen 80;

        # Forward all traffic to FastAPI
        location / {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Allow large batch uploads (default nginx limit is 1 MB)
            client_max_body_size 10M;

            # Keep connections alive with uvicorn
            proxy_set_header   Connection        "";
        }
    }

    # HTTPS block — uncomment and fill in cert paths when deploying to Hostinger
    #
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
