                $ref: '#/components/schemas/TemperatureRow'
      responses:
        '201':
          description: Inserted.
        '401':
          description: Missing or invalid credentials.

  /rest/v1/ring_hrv:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertHRV
      summary: Insert HRV rows (Android sync)
      description: |
        `sync_id` suffixed with `-hrv`.
        For synced history: `HRVRsp.pressureArray` is a byte array — divide each element by 10
        for the actual ms value.
      security:
        - BearerAuth: []
