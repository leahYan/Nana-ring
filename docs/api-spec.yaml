# ──────────────────────────────────────────────────────────────────────────────
# Paths — Supabase PostgREST (Android direct sync)
# ──────────────────────────────────────────────────────────────────────────────
# Auth on every request:
#   Header  apikey: <anon_key>
#   Header  Authorization: Bearer <access_token>
#   Header  Prefer: resolution=ignore-duplicates   (for idempotent retries)
#   Header  Content-Type: application/json
# RLS enforces user_id = auth.uid() — anon key alone grants no data access.
# ──────────────────────────────────────────────────────────────────────────────

  /rest/v1/ring_heart_rate:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertHeartRate
      summary: Insert heart rate rows (Android sync)
      description: |
        Android posts an array of heart rate records directly to Supabase PostgREST.

        **Required headers:**
        - `apikey: <anon_key>`
        - `Authorization: Bearer <access_token>`
        - `Prefer: resolution=ignore-duplicates` — prevents duplicates on WorkManager retry
        - `Content-Type: application/json`

        Android generates `id` client-side.  `user_id` must be the authenticated user's UUID
        from `authStore.userId`.  RLS rejects rows where `user_id ≠ auth.uid()`.
      security:
        - BearerAuth: []
        - SupabaseApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/HeartRateRow'
      responses:
        '201':
          description: Inserted (or ignored if duplicate).
        '401':
          description: Missing or invalid credentials.

  /rest/v1/ring_spo2:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertSpO2
      summary: Insert SpO2 rows (Android sync)
      description: |
        Android derives SpO2 from `HeartRateEntity.spO2`.  `sync_id` is suffixed with `-spo2`
        to avoid collision with the heart-rate row from the same measurement.
        `reading_type` is always `"manual"` for current sync path.
      security:
        - BearerAuth: []
        - SupabaseApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SpO2Row'
      responses:
        '201':
          description: Inserted.
        '401':
          description: Missing or invalid credentials.

  /rest/v1/ring_blood_pressure:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertBloodPressure
      summary: Insert blood pressure rows (Android sync)
      description: |
        `sync_id` suffixed with `-bp`.
        NOTE — ring does not measure BP optically; systolic/diastolic are SDK-derived from
        the HR signal via `CalcBloodPressureByHeart`.  UI must disclose this.
      security:
        - BearerAuth: []
        - SupabaseApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BloodPressureRow'
      responses:
        '201':
          description: Inserted.
        '401':
          description: Missing or invalid credentials.

  /rest/v1/ring_temperature:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertTemperature
      summary: Insert temperature rows (Android sync)
      description: |
        `sync_id` suffixed with `-temp`.
        `StopHeartRateRsp.temperature` (int) must be divided by 100.0 for `one_click` mode.
      security:
        - BearerAuth: []
        - SupabaseApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
