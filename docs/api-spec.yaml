  /rest/v1/ring_activity:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertActivity
      summary: Insert daily activity summary rows (Android sync)
      description: |
        One row per calendar day.  `BleStepTotal.calorie` is in small calories — Android must
        divide by 1000 before setting `calories_kcal`.
      security:
        - BearerAuth: []
        - SupabaseApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ActivityRow'
      responses:
        '201':
          description: Inserted.
        '401':
          description: Missing or invalid credentials.

  /rest/v1/ring_sleep:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertSleep
      summary: Insert sleep session rows (Android sync)
      description: |
        Android inserts the parent sleep row first.  The UUID used for `id` is then referenced
        as `sleep_id` in each stage row posted to `/rest/v1/ring_sleep_stage_detail`.

        Unlike the FastAPI batch endpoint (which derives `total_minutes` server-side), Android
        must compute and include `total_minutes = deep + light + rem + awake` when posting
        directly to Supabase.
      security:
        - BearerAuth: []
        - SupabaseApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SleepRow'
      responses:
        '201':
          description: Inserted.
        '401':
          description: Missing or invalid credentials.

  /rest/v1/ring_sleep_stage_detail:
    servers:
      - url: https://{project_ref}.supabase.co
        variables:
          project_ref:
            default: your-project-ref
    post:
      tags: [supabase-health]
      operationId: supabaseInsertSleepStages
      summary: Insert sleep stage detail rows (Android sync)
      description: |
        Posted **after** the parent `/rest/v1/ring_sleep` insert.  Each row references the
        parent via `sleep_id`.  Android must populate `stage_label` (the FastAPI backend does
        this automatically; Supabase PostgREST does not):
        0→none, 1→removed, 2→light, 3→deep, 4→rem, 5→awake.
      security:
        - BearerAuth: []
        - SupabaseApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SleepStageRow'
      responses:
        '201':
          description: Inserted.
        '401':
          description: Missing or invalid credentials.
